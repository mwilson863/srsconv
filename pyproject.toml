[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "srsconv"
version = "0.1.0"
description = "Convert flashcards between Anki's plain text export and a small SM-2 JSON format"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "mwilson863" }]
dependencies = []

[project.scripts]
srsconv = "srsconv.cli:main"

[tool.setuptools.packages.find]
include = ["srsconv*"]
